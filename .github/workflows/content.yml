name: Обновление учебных материалов
on:
  workflow_dispatch:
  schedule:
    - cron: '21 6 * * *'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run sync:content
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-content-candidate
          path: data/catalog.json
          retention-days: 7
